<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snagly — Video Downloader, Clip Trimmer &amp; Private Vault for Chrome</title>
    <meta
      name="description"
      content="Snagly (snagly.video) is a local-first Chrome extension for capturing standard HLS, DASH, and MP4 streams, trimming video segments, batch queueing, and storing media in a PIN-locked Private Vault."
    />
    <link rel="canonical" href="https://snagly.video/" />

    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Snagly" />
    <meta property="og:url" content="https://snagly.video/" />
    <meta property="og:title" content="Snagly — Video Downloader, Clip Trimmer & Private Vault" />

      property="og:description"
      content="Save, trim, and organize standard web video streams directly in Chrome. Local browser processing, optional FFmpeg companion, and PIN-locked Private Vault."

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Snagly — Video Downloader, Clip Trimmer & Private Vault" />
    <meta
      name="twitter:description"
      content="Chrome extension for standard HLS/DASH/MP4 capture, lossless segment trimming, bulk downloads, and Private Vault storage."
    />

    <!-- Typography: Plus Jakarta Sans (Display), DM Sans (Body), JetBrains Mono (Specs/Codes) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

            "@type": "Offer",
