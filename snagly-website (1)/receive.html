<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Snagly</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --ink: #0f172a;
      --mute: #64748b;
      --line: #e2e8f0;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --ok: #059669;
      --ok-soft: #ecfdf5;
      --bad: #dc2626;
      --bad-soft: #fef2f2;
      --radius: 18px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --card: #111827;
        --ink: #f8fafc;
        --mute: #94a3b8;
        --line: #1e293b;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --ok: #34d399;
        --ok-soft: rgba(16, 185, 129, 0.14);
        --bad: #f87171;
        --bad-soft: rgba(239, 68, 68, 0.14);
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    .shell {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 4px;
    }
    .logo {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      flex: none;
    }
    .logo svg { width: 16px; height: 16px; }
    .brand-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .title {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
      word-break: break-word;
    }
    .sub-meta {
      margin-top: 4px;
      font-size: 13px;
      color: var(--mute);
      font-variant-numeric: tabular-nums;
    }
    .preview-box {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--line);
    }
    .preview-box video {
      display: block;
      width: 100%;
      max-height: 260px;
      background: #000;
    }
    .prog-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .prog-track {
      width: 100%;
      height: 9px;
      border-radius: 99px;
      background: var(--line);
      overflow: hidden;
    }
    .prog-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.14s ease-out;
    }
    .prog-fill.done { background: var(--ok); }
    .prog-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      color: var(--mute);
      font-variant-numeric: tabular-nums;
    }
    .status-line {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--mute);
      line-height: 1.4;
      padding: 10px 12px;
      border-radius: 11px;
      background: var(--bg);
      border: 1px solid var(--line);
    }
    .status-line.ok {
      background: var(--ok-soft);
      border-color: rgba(16, 185, 129, 0.28);
      color: var(--ok);
    }
    .status-line.bad {
      background: var(--bad-soft);
      border-color: rgba(239, 68, 68, 0.28);
      color: var(--bad);
    }
    .btn {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid transparent;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: background 0.15s, transform 0.08s;
    }
    .btn:active { transform: scale(0.99); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-success { background: var(--ok); color: #fff; }
    .btn-secondary {
      background: transparent;
      color: var(--ink);
      border-color: var(--line);
      min-height: 44px;
      font-size: 13.5px;
      font-weight: 600;
    }
    [hidden] { display: none !important; }
  </style>
<body>
  <main class="shell">
    <header class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <span class="brand-name">Snagly</span>
    </header>

    <!-- Direct Video Download -->
    <section class="card" id="directView" hidden>
      <div>
        <h1 class="title" id="directTitle">Video</h1>
      </div>

      <div class="preview-box" id="directPreviewWrap" hidden>
        <video id="directVideo" controls playsinline preload="metadata"></video>
      </div>

      <div class="status-line" id="directStatus" hidden></div>

      <div class="prog-wrap" id="directProgWrap" hidden>
        <div class="prog-track"><div class="prog-fill" id="directProgFill"></div></div>
        <div class="prog-stats">
          <span id="directProgLabel">Downloading…</span>
          <span id="directProgPct">0%</span>
        </div>
      </div>

      <button type="button" class="btn btn-primary" id="directDownloadBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12m0 0l-5-5m5 5l5-5M5 20h14"/></svg>
        <span>Download Video</span>
      </button>

      <a class="btn btn-secondary" id="directOpenLink" target="_blank" rel="noopener noreferrer">Open Video</a>
    </section>

    <!-- File Transfer -->
    <section class="card" id="p2pView" hidden>
      <div>
        <h1 class="title" id="p2pTitle">Connecting…</h1>
        <div class="sub-meta" id="p2pMeta" hidden></div>
      </div>

      <div class="status-line" id="p2pStatus">Connecting…</div>

      <div class="prog-wrap" id="p2pProgWrap" hidden>
        <div class="prog-track"><div class="prog-fill" id="p2pProgFill"></div></div>
        <div class="prog-stats">
          <span id="p2pProgBytes">0 MB</span>
          <span id="p2pProgPct">0%</span>
        </div>
      </div>

      <div class="preview-box" id="p2pPreviewWrap" hidden>
        <video id="p2pVideo" controls playsinline preload="metadata"></video>
      </div>

      <button type="button" class="btn btn-success" id="p2pSaveBtn" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12m0 0l-5-5m5 5l5-5M5 20h14"/></svg>
        <span>Save Video</span>
      </button>

      <button type="button" class="btn btn-secondary" id="p2pReconnectBtn" hidden>Try Again</button>
    </section>

    <!-- Empty Landing -->
    <section class="card" id="emptyView" hidden>
      <h1 class="title">No video link found</h1>
      <a class="btn btn-primary" href="index.html">Go to Snagly</a>
    </section>
  </main>

  <script src="vendor/peerjs.min.js"></script>
  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      const mode = (params.get("mode") || "").toLowerCase();

      function fmtBytes(b) {
        const n = Number(b) || 0;
        if (n <= 0) return "0 MB";
        if (n >= 1e9) return (n / 1e9).toFixed(2) + " GB";
        if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";
        return Math.max(1, Math.round(n / 1024)) + " KB";
      }

      function sanitizeName(name) {
        const cleaned = String(name || "video.mp4").replace(/[<>:"/\\|?*\x00-\x1f]/g, "_").trim();
        return cleaned || "video.mp4";
      }

      function triggerSaveBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = sanitizeName(filename);
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => { try { URL.revokeObjectURL(url); } catch {} }, 60000);
      }

      function ensurePeerJs() {
        if (typeof Peer !== "undefined") return Promise.resolve();
        return new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = "https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";
          s.onload = () => typeof Peer !== "undefined" ? resolve() : reject(new Error("Connection unavailable."));
          s.onerror = () => reject(new Error("Connection unavailable."));
          document.head.appendChild(s);
        });
      }

      // Direct Video URL
      if (mode === "direct") {
        const rawUrl = params.get("url") || "";
        const fileName = sanitizeName(params.get("name") || "video.mp4");

        if (!/^https?:\/\//i.test(rawUrl)) {
          $("emptyView").hidden = false;
          return;
        }

        $("directView").hidden = false;
        $("directTitle").textContent = fileName;
        $("directOpenLink").href = rawUrl;

        const isSegmented = /\.(m3u8|mpd)(\?|#|$)/i.test(rawUrl);
        if (!isSegmented) {
          const vid = $("directVideo");
          vid.src = rawUrl;
          vid.onloadedmetadata = () => { $("directPreviewWrap").hidden = false; };
          vid.onerror = () => { $("directPreviewWrap").hidden = true; };
        }

        const setDirectStatus = (kind, text) => {
          const el = $("directStatus");
          el.className = "status-line" + (kind ? " " + kind : "");
          el.textContent = text;
          el.hidden = false;
        };

        $("directDownloadBtn").onclick = async () => {
          const btn = $("directDownloadBtn");
          btn.disabled = true;
          $("directProgWrap").hidden = false;
          $("directProgFill").style.width = "0%";
          $("directProgFill").classList.remove("done");
          $("directProgPct").textContent = "0%";
          $("directProgLabel").textContent = "Downloading…";
          setDirectStatus("", "Downloading video…");

          try {
            const resp = await fetch(rawUrl, { credentials: "omit", referrerPolicy: "no-referrer" });
            if (!resp.ok) throw new Error("Blocked");
            const total = Number(resp.headers.get("content-length")) || 0;
            const chunks = [];
            let received = 0;

            if (resp.body && resp.body.getReader) {
              const reader = resp.body.getReader();
              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                if (value) {
                  chunks.push(value);
                  received += value.byteLength;
                  if (total > 0) {
                    const pct = Math.min(100, Math.round((received / total) * 100));
                    $("directProgFill").style.width = pct + "%";
                    $("directProgPct").textContent = pct + "%";
                    $("directProgLabel").textContent = `${fmtBytes(received)} / ${fmtBytes(total)}`;
                  } else {
                    $("directProgFill").style.width = "100%";
                    $("directProgPct").textContent = fmtBytes(received);
                    $("directProgLabel").textContent = "Downloading…";
                  }
                }
              }
            } else {
              const buf = await resp.arrayBuffer();
              chunks.push(new Uint8Array(buf));
            }

            const mime = resp.headers.get("content-type") || "video/mp4";
            const blob = new Blob(chunks, { type: mime });
            $("directProgFill").style.width = "100%";
            $("directProgFill").classList.add("done");
            $("directProgPct").textContent = "100%";
            $("directProgLabel").textContent = fmtBytes(blob.size);
            setDirectStatus("ok", "Saved to your phone.");
            triggerSaveBlob(blob, fileName);
          } catch {
            const a = document.createElement("a");
            a.href = rawUrl;
            a.download = fileName;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            document.body.appendChild(a);
            a.click();
            a.remove();
            setDirectStatus("", "Opened video link. Tap Open Video if it didn't start.");
          } finally {
            btn.disabled = false;
          }
        };
        return;
      }

      // File Transfer
      if (mode === "p2p") {
        const room = (params.get("room") || "").trim();
        if (!/^[a-zA-Z0-9_-]{4,64}$/.test(room)) {
          $("emptyView").hidden = false;
          return;
        }
        $("p2pView").hidden = false;

        const targetPeerId = "snagly-" + room;
        let peer = null;
        let activeConn = null;
        let assembledBlob = null;
        let fileMeta = { name: "video.mp4", size: 0, mime: "video/mp4" };
        let receivedChunks = [];
        let receivedBytes = 0;
        let finished = false;
        let connectTimeout = null;
        let blobQueue = Promise.resolve();
        let activeAttempt = 0;

        const setStatus = (kind, text) => {
          const el = $("p2pStatus");
          el.className = "status-line" + (kind ? " " + kind : "");
          el.textContent = text;
        };

        function clearWatchdog() {
          if (connectTimeout) {
            clearTimeout(connectTimeout);
            connectTimeout = null;
          }
        }

        function cleanup() {
          clearWatchdog();
          if (activeConn) { try { activeConn.close(); } catch {} activeConn = null; }
          if (peer) { try { peer.destroy(); } catch {} peer = null; }
        }

        function showP2pError(msg) {
          if (finished) return;
          clearWatchdog();
          setStatus("bad", msg || "Couldn't connect. Tap Try Again.");
          $("p2pReconnectBtn").hidden = false;
        }

        function finalizeFile(conn) {
          if (finished) return;
          finished = true;
          clearWatchdog();
          assembledBlob = new Blob(receivedChunks, { type: fileMeta.mime || "video/mp4" });
          receivedChunks = [];
          const finalSize = assembledBlob.size || receivedBytes;
          $("p2pProgWrap").hidden = false;
          $("p2pProgFill").style.width = "100%";
          $("p2pProgFill").classList.add("done");
          $("p2pProgPct").textContent = "100%";
          $("p2pProgBytes").textContent = fmtBytes(finalSize);
          setStatus("ok", "Download complete.");

          try {
            const ack = JSON.stringify({ type: "ack", receivedBytes: finalSize });
            const dc = conn && conn.dataChannel;
            if (dc && dc.readyState === "open") {
              dc.send(ack);
            } else if (conn && conn.open) {
              conn.send(ack);
            }
          } catch {}

          const saveBtn = $("p2pSaveBtn");
          saveBtn.hidden = false;
          saveBtn.onclick = () => triggerSaveBlob(assembledBlob, fileMeta.name);

          if (/^video\//i.test(assembledBlob.type) || /\.(mp4|webm|mov|m4v)$/i.test(fileMeta.name)) {
            const url = URL.createObjectURL(assembledBlob);
            const vid = $("p2pVideo");
            vid.src = url;
            vid.onloadedmetadata = () => { $("p2pPreviewWrap").hidden = false; };
          }

          triggerSaveBlob(assembledBlob, fileMeta.name);
        }

        function processIncomingPayload(data, conn) {
          if (finished) return;
          if (typeof data === "string") {
            try {
              const msg = JSON.parse(data);
              if (msg.type === "meta") {
                clearWatchdog();
                fileMeta = {
                  name: sanitizeName(msg.name || "video.mp4"),
                  size: Number(msg.size) || 0,
                  mime: msg.mime || "video/mp4"
                };
                receivedChunks = [];
                receivedBytes = 0;
                finished = false;
                $("p2pTitle").textContent = fileMeta.name;
                if (fileMeta.size > 0) {
                  $("p2pMeta").textContent = fmtBytes(fileMeta.size);
                  $("p2pMeta").hidden = false;
                }
                $("p2pProgWrap").hidden = false;
                $("p2pProgBytes").textContent = `0 MB / ${fmtBytes(fileMeta.size)}`;
                setStatus("", "Downloading…");
              } else if (msg.type === "eof") {
                finalizeFile(conn);
              }
            } catch {}
            return;
          }

          if (!data) return;
          const view = data instanceof ArrayBuffer
            ? new Uint8Array(data)
            : (ArrayBuffer.isView(data) ? new Uint8Array(data.buffer, data.byteOffset, data.byteLength) : null);
          if (!view || !view.byteLength) return;

          receivedChunks.push(view);
          receivedBytes += view.byteLength;

          const total = fileMeta.size || receivedBytes;
          const pct = total > 0 ? Math.min(100, Math.round((receivedBytes / total) * 100)) : 0;
          $("p2pProgWrap").hidden = false;
          $("p2pProgFill").style.width = pct + "%";
          $("p2pProgPct").textContent = pct + "%";
          $("p2pProgBytes").textContent = `${fmtBytes(receivedBytes)} / ${fmtBytes(total)}`;

          if (fileMeta.size > 0 && receivedBytes >= fileMeta.size) {
            finalizeFile(conn);
          }
        }

        function handleIncomingData(data, conn, attemptId) {
          if (attemptId !== activeAttempt || finished) return;
          if (data instanceof Blob) {
            blobQueue = blobQueue.then(() => data.arrayBuffer()).then(buf => {
              if (attemptId === activeAttempt && !finished) processIncomingPayload(buf, conn);
            }).catch(() => {});
          } else {
            blobQueue = blobQueue.then(() => {
              if (attemptId === activeAttempt && !finished) processIncomingPayload(data, conn);
            });
          }
        }

        async function startP2p() {
          const attemptId = ++activeAttempt;
          cleanup();
          assembledBlob = null;
          receivedChunks = [];
          receivedBytes = 0;
          finished = false;
          blobQueue = Promise.resolve();
          $("p2pSaveBtn").hidden = true;
          $("p2pReconnectBtn").hidden = true;
          $("p2pPreviewWrap").hidden = true;
          $("p2pProgWrap").hidden = true;
          $("p2pMeta").hidden = true;
          $("p2pProgFill").style.width = "0%";
          $("p2pProgFill").classList.remove("done");
          $("p2pProgPct").textContent = "0%";
          $("p2pTitle").textContent = "Connecting…";
          setStatus("", "Connecting…");

          try {
            await ensurePeerJs();
          } catch {
            if (attemptId === activeAttempt) showP2pError("Couldn't connect. Tap Try Again.");
            return;
          }
          if (attemptId !== activeAttempt) return;

          connectTimeout = setTimeout(() => {
            if (attemptId === activeAttempt && !finished && receivedBytes === 0) {
              showP2pError("Couldn't reach your computer. Make sure Snagly is open and tap Try Again.");
            }
          }, 25000);

          const localId = "snagly-rx-" + Math.random().toString(36).slice(2, 10);
          peer = new Peer(localId, {
            debug: 0,
            config: {
              iceServers: [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" },
                { urls: "stun:stun2.l.google.com:19302" },
                { urls: "stun:stun.cloudflare.com:3478" }
              ]
            }
          });

          peer.on("open", () => {
            if (attemptId !== activeAttempt) return;
            // PeerJS 1.5.4 SerializationType.None string value is "raw"
            const conn = peer.connect(targetPeerId, { reliable: true, serialization: "raw" });
            activeConn = conn;

            if (conn && conn.peerConnection) {
              conn.peerConnection.addEventListener("iceconnectionstatechange", () => {
                if (attemptId !== activeAttempt || finished) return;
                const st = conn.peerConnection && conn.peerConnection.iceConnectionState;
                if (st === "failed") {
                  showP2pError("Connection failed. Make sure both devices are online and tap Try Again.");
                }
              });
            }

            conn.on("open", () => {
              if (attemptId !== activeAttempt) return;
              clearWatchdog();
              if (conn.dataChannel) conn.dataChannel.binaryType = "arraybuffer";
              setStatus("", "Connected. Starting download…");
            });

            conn.on("data", data => handleIncomingData(data, conn, attemptId));

            conn.on("close", () => {
              if (attemptId !== activeAttempt) return;
              if (!finished && receivedBytes > 0 && fileMeta.size > 0 && receivedBytes >= fileMeta.size) {
                finalizeFile(conn);
              } else if (!finished) {
                showP2pError("Connection lost. Tap Try Again.");
              }
            });

            conn.on("error", () => {
              if (attemptId === activeAttempt && !finished) {
                showP2pError("Couldn't finish download. Tap Try Again.");
              }
            });
          });

          peer.on("error", err => {
            if (attemptId !== activeAttempt || finished) return;
            const kind = err && err.type ? String(err.type) : "";
            if (kind === "peer-unavailable") {
              showP2pError("Session not found or closed. Generate a new QR code on your computer.");
            } else {
              showP2pError("Couldn't connect. Tap Try Again.");
            }
          });
        }

        $("p2pReconnectBtn").onclick = startP2p;
        startP2p();
        return;
      }

      $("emptyView").hidden = false;
    })();
  </script>
</body>
</html>
